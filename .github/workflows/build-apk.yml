name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 34 toolchain
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Godot 4.4.1
        run: |
          mkdir -p /opt/godot /home/runner/.local/share/godot/export_templates/4.4.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /opt/godot
          chmod +x /opt/godot/Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz -d /home/runner/.local/share/godot/export_templates/4.4.1.stable

      - name: Configure debug signing
        run: |
          mkdir -p /home/runner/.android /home/runner/.config/godot
          keytool -genkeypair -noprompt \
            -keystore /home/runner/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Kedi Macerasi,C=TR"
          cp ci/editor_settings-4.tres /home/runner/.config/godot/editor_settings-4.4.tres

      - name: Validate Godot project
        run: /opt/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          /opt/godot/Godot_v4.4.1-stable_linux.x86_64 --verbose --headless --path . --export-debug Android build/kedi-macerasi.apk

      - name: Locate APK
        run: |
          mkdir -p dist
          find . -type f -name '*.apk' -print
          test -f build/kedi-macerasi.apk
          cp build/kedi-macerasi.apk dist/Kedi-Macerasi-v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kedi-Macerasi-APK
          path: dist/Kedi-Macerasi-v0.1.0.apk
          if-no-files-found: error
          retention-days: 30
